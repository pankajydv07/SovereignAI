[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swaraj-core"
version = "0.1.0"
description = "SWARAJ Agentic AI Python Core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.0.0",
    "pdfplumber>=0.11.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "numpy>=1.26.0",
    "python-docx>=1.1.0",
    "docxtpl>=0.16.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    "pint>=0.23",
    "pyyaml>=6.0.1",
    "reportlab>=4.0.0",
    "pypdf>=5.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "protocol*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "aiosqlite.*",
    "docx.*",
    "docxtpl.*",
    "pptx.*",
    "openpyxl.*",
    "jinja2.*",
    "pint.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", ".."]
asyncio_mode = "auto"

