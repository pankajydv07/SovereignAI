[package]
name = "swaraj-desktop"
version = "0.1.0"
description = "SWARAJ Desktop App Shell (Tauri 2)"
authors = ["SovereignAI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
portable-pty = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
